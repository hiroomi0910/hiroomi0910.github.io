about: |
  業務系システムの Java 開発から出発し、eラーニング制作、EC・Web 制作を経て、ここ数年は React / TypeScript を中心としたフロントエンド開発を専門にしています。フリーランスとして約8年、住まい・不動産領域の情報サービスや製造業向けの業務システムで、UI コンポーネント開発、リファクタリング、フォーム開発、CMS の内製化に携わってきました。

  得意なのは、画面ごとに書き方がばらついたコードベースを、共通コンポーネントの整備で読みやすく直すこと。アクセシビリティ（WAI-ARIA、キーボード操作）を自分の判断で実装に取り入れ、レビューでも同じ観点で指摘しています。必要なときはフロントエンドの外（Rails での認証機能など）にも手を伸ばします。

strengths:
  - title: React / TypeScript の実装力
    body: ワークフローの段階で振る舞いが変わる業務画面、複数ステップのフォーム、デザインシステムの改修。
  - title: コードベースの立て直し
    body: 共通コンポーネントの移植・切り出しで実装方針をそろえ、見通しと修正漏れを改善。
  - title: 領域を越える
    body: 内製 CMS で UI からダッシュボード、API 連携、認証機能まで担当。
  - title: 仕様の整理と調整
    body: PdM・デザイナー・バックエンド・海外拠点のエンジニアと連携。着手前の調査で不要な開発を止めた経験。
