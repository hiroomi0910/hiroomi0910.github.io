- title: 製造業向け 全社共通マスタ管理システムの画面開発
  period: 2026年1月〜7月（7か月）
  role: フロントエンドエンジニア（実装メイン、クロスレビュー）
  team: 約15名
  tech: [React 19, TypeScript, Vite, Tailwind CSS, SQL, Azure DevOps]
  phases: [詳細設計, 実装, 単体テスト, 運用保守]
  summary: 基幹システム（ERP）と連携するマスタ管理の申請・承認ワークフロー画面。段階（申請・確認・承認・照会）ごとに機能が変わる画面を10画面担当。一時保存・差戻・引戻など段階別のアクション、業務ルールに基づく入力チェックを実装。
  highlights:
    - 採用されなかった新環境の共通コンポーネント10個以上を既存環境へ移植し、確認ダイアログなども新たに共通化。書き方がそろい、同じ UI の修正漏れが減った。
    - 新機能の追加検討で、自ら関係者に聞き取って検討資料を作成。不要と判断され、着手前に開発工数を省けた。

- title: 住まい・不動産領域の情報サービスのフロントエンド開発（事業会社）
  period: 2019年1月〜2025年12月（約7年）
  role: フロントエンドエンジニア（実装メイン、クロスレビュー）
  team: 20名以上（施策ごとに PdM・デザイナー・FE・BE の小規模チーム）
  tech: [React, TypeScript, Next.js, Ruby on Rails, Tailwind CSS, Storybook, Figma]
  phases: [要件定義, 基本設計, 詳細設計, 実装, テスト, 運用保守]
  summary: UI コンポーネント開発、既存画面のリファクタリングとパフォーマンス改善、LP 制作、デザインシステムの改修、海外拠点のエンジニアを含むクロスレビュー。
  highlights:
    - 予約フォームを6ステップから3ステップに。ステップをまたぐ入力値の保持とバリデーションのタイミングを技術調査し、バックエンド担当とのペアプロでカレンダー入力の DB 連携を仕上げてリリース。
    - 外部のクラウド CMS から内製 CMS へ。デザインツールを使わずプロトタイプから UI を構築し、ダッシュボードの項目選定から API 連携まで担当。人手が減った時期はログイン・認証機能も実装。予定より約3か月早くリリースし、月額数十万円規模の外部 CMS 費用を削減。
    - アクセシビリティ対応を自分の判断で実装に取り入れ、レビューでも指摘。

