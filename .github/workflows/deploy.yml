name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 毎日 1 回ビルドし直す（入口の写真の入れ替え・Qiita 記事の反映）。
  # cron は UTC。20:17 UTC = 日本時間 5:17（毎時 0 分は混むので避ける）
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build, check and upload
        uses: withastro/action@v6
        with:
          build-cmd: npm run build && npm run check:dist
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
